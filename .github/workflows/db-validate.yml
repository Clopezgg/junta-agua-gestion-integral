name: Validar base de datos (Supabase local)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  db:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: v2.116.0
      - name: "Iniciar pila local (Postgres) y aplicar migraciones 001..051 desde cero"
        run: supabase start
      - name: Sembrar estado post-bootstrap (organización y catálogo de permisos)
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            -e PGHOST=127.0.0.1 \
            -e PGPORT=54322 \
            -e PGUSER=postgres \
            -e PGDATABASE=postgres \
            -v "$PWD/supabase/tests/seed_integrity.sql:/tmp/seed_integrity.sql:ro" \
            --entrypoint psql postgres:16-alpine \
            -v ON_ERROR_STOP=1 \
            -f /tmp/seed_integrity.sql
      - name: Verificar integridad financiera (migraciones 032 a 045)
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            -e PGHOST=127.0.0.1 \
            -e PGPORT=54322 \
            -e PGUSER=postgres \
            -e PGDATABASE=postgres \
            -v "$PWD/supabase/tests/db_integrity.sql:/tmp/db_integrity.sql:ro" \
            --entrypoint psql postgres:16-alpine \
            -f /tmp/db_integrity.sql
      - name: "Verificar endurecimiento P0 (migración 045): multi-abonado, cross-org y MFA/AAL2"
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            -e PGHOST=127.0.0.1 \
            -e PGPORT=54322 \
            -e PGUSER=postgres \
            -e PGDATABASE=postgres \
            -v "$PWD/supabase/tests/p0_hardening.sql:/tmp/p0_hardening.sql:ro" \
            --entrypoint psql postgres:16-alpine \
            -v ON_ERROR_STOP=1 \
            -f /tmp/p0_hardening.sql
      - name: Inspeccionar plan de migraciones
        run: supabase migration list --db-url "$(supabase status -o env | sed -n 's/^DATABASE_URL=//p')" || true
      - name: Detener pila local
        if: always()
        run: supabase stop

  functions:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Comprobar sintaxis y tipos de funciones edge
        run: |
          set -e
          for dir in supabase/functions/*/; do
            name="$(basename "$dir")"
            deno check --no-config --no-lock "$dir/index.ts"
            echo "OK: supabase/functions/${name}"
          done
      - name: Verificar configuración de funciones
        run: |
          grep -q '\[functions.whatsapp-webhook\]' supabase/config.toml
          grep -q 'verify_jwt = false' supabase/config.toml