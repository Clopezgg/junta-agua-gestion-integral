name: Validar aplicación

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          registry-url: 'https://registry.npmjs.org'
      - name: Verificar registro público
        run: |
          test "$(npm config get registry)" = "https://registry.npmjs.org/"
          test ! -f package-lock.json
      - name: Instalar dependencias
        run: npm install --include=dev --no-audit --no-fund --registry=https://registry.npmjs.org/
      - name: Pruebas
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      - name: Lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint-output.log
      - name: Compilar
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build:render 2>&1 | tee build-output.log
      - name: Verificar publicación
        id: publish
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            test -f dist/index.html
            test -f dist/health.txt
            test -f dist/_redirects
          } 2>&1 | tee publish-output.log
      - name: Guardar diagnósticos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnosticos-validacion
          path: |
            test-output.log
            lint-output.log
            build-output.log
            publish-output.log
          if-no-files-found: warn
          retention-days: 7
      - name: Fallar si alguna validación falló
        if: always()
        run: |
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
          test "${{ steps.publish.outcome }}" = "success"
