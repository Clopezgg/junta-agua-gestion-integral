name: E2E real (navegador + Supabase local)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Configurar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Iniciar pila local (aplica migraciones 001..034)
        run: supabase start
      - name: Sembrar usuario, organización y datos de negocio
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=postgres \
            -e PGHOST=127.0.0.1 \
            -e PGPORT=54322 \
            -e PGUSER=postgres \
            -e PGDATABASE=postgres \
            -v "$PWD/supabase/tests/e2e_seed.sql:/tmp/e2e_seed.sql:ro" \
            --entrypoint psql postgres:16-alpine \
            -v ON_ERROR_STOP=1 -f /tmp/e2e_seed.sql
      - name: Exportar configuración de Supabase para la aplicación
        id: env
        run: |
          supabase status -o env > /tmp/supabase.env
          ANON_KEY="$(sed -n 's/^ANON_KEY=//p' /tmp/supabase.env)"
          echo "VITE_SUPABASE_URL=http://127.0.0.1:54321"
          echo "VITE_SUPABASE_ANON_KEY_VALUE=${ANON_KEY}"
          echo "anon_key=${ANON_KEY}" >> "$GITHUB_OUTPUT"
      - name: Instalar navegador Chromium
        run: npx playwright install --with-deps chromium
      - name: Ejecutar pruebas E2E reales
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_ANON_KEY: ${{ steps.env.outputs.anon_key }}
        run: npx playwright test
      - name: Detener pila local
        if: always()
        run: supabase stop